name: CRM CI

on:
  push:
    paths: ['crm-platform/**', '.github/workflows/crm-ci.yml']
  pull_request:
    paths: ['crm-platform/**']

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: crm-platform/apps/api }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crm-platform/apps/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Tests (in-process Postgres / PGlite)
        run: npm test
      - name: Tests (real PostgreSQL service)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/crm_test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: crm-platform/apps/web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crm-platform/apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
