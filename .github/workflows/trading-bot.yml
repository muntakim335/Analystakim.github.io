name: Trading Bot

on:
  schedule:
    # Weekdays (UTC). The bot itself checks the market calendar/clock,
    # so holidays and DST edge cases are handled in code.
    - cron: "0 13 * * 1-5"   # pre-market plan
    - cron: "45 14 * * 1-5"  # trade (market is open in both EST and EDT)
    - cron: "15 21 * * 1-5"  # post-close report
  workflow_dispatch:
    inputs:
      mode:
        description: "Which job to run"
        required: true
        type: choice
        options: [plan, trade, report]

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine mode
        id: mode
        run: |
          if [ -n "${{ inputs.mode }}" ]; then
            MODE="${{ inputs.mode }}"
          else
            H=$(date -u +%H)
            case "$H" in
              13) MODE=plan ;;
              14|15) MODE=trade ;;
              *) MODE=report ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Running mode: $MODE"

      - name: Check credentials
        id: creds
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        run: |
          if [ -z "$ALPACA_API_KEY" ]; then
            echo "::warning::ALPACA_API_KEY / ALPACA_SECRET_KEY secrets are not set. See tradingbot/README.md for setup. Skipping run."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.creds.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tradingbot/requirements.txt

      - name: Install dependencies
        if: steps.creds.outputs.ok == 'true'
        run: pip install -r tradingbot/requirements.txt

      - name: Run bot
        if: steps.creds.outputs.ok == 'true'
        working-directory: tradingbot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m bot.main --mode "${{ steps.mode.outputs.mode }}"

      - name: Commit journal and state
        if: steps.creds.outputs.ok == 'true'
        run: |
          git config user.name "trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tradingbot/journal tradingbot/state
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "bot: ${{ steps.mode.outputs.mode }} $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
